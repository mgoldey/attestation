# Local hooks only: every tool is already a declared dev dependency, so they
# run against the versions this project pins. The alternative (pre-commit's own
# isolated envs) would install a *second* copy of ruff at a version nothing
# else uses, and drift silently.
#
# Entries call `uv run --frozen ...`: this used to call `.venv/bin/...`
# directly because, at the time, pre-commit's scrubbed environment made
# `uv run pytest` resolve an interpreter that could not import the project at
# all ("No module named 'attestation'", 22 collection errors) even though the
# same command passed in a normal shell. That no longer reproduces (verified
# with `env -i PATH=/usr/bin:/bin uv run --frozen python -c "import
# attestation"`, which now succeeds), and `.venv/bin/...` has a real cost:
# `.venv/` is gitignored, so those paths don't exist on a fresh clone until
# `uv sync`, and a CI runner using astral-sh/setup-uv may not put its venv at
# `.venv` at all. `--frozen` keeps these hooks from ever mutating uv.lock.
#
#   uv run pre-commit install        # activate
#   uv run pre-commit run --all-files
#   git commit --no-verify           # bypass once, deliberately
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]

      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ty
        name: ty (type check)
        entry: uv run --frozen ty check src/
        language: system
        types_or: [python, pyi]
        # src/ only, and always the whole tree: ty resolves imports across
        # modules, so checking just the staged files reports errors that a
        # full run does not, and misses ones it would catch.
        pass_filenames: false

      - id: uv-lock
        name: uv.lock matches pyproject.toml
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run --frozen python -m pytest -q
        language: system
        types: [python]
        pass_filenames: false
        # The suite is ~50s. That is slow for a hook and worth it here: this
        # repo's recurring failure has been tests that pass against the bug
        # they were written to catch, so a green suite is the one signal that
        # has repeatedly mattered. Drop this hook if it starts being bypassed.
        stages: [pre-commit]
