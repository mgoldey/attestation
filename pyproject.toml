[project]
name = "attestation"
version = "0.1.0"
description = "Auditable research provenance: experiment runs, verifiable claims, a reading graph, and symbolic derivations — fully local"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matthew Goldey" }]
dependencies = [
    "feedparser>=6.0",
    "sqlite-vec>=0.1.6",
    "httpx>=0.27",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "langgraph>=0.2",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
    "mcp==1.28.1",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "sympy>=1.13",
]

[project.scripts]
attest = "attestation.cli:main"
attest-mcp = "attestation.mcp_server:main"

[dependency-groups]
# datasette is a dev/ops dependency, never imported by the package: it browses
# hermes.db as a separate process, so a `uvx hermes-rss` install never pays for
# it and a broken version cannot break the tools.
dev = ["pytest>=8", "ruff>=0.6", "ty", "radon>=6", "datasette>=0.64", "datasette-vega>=0.6", "pre-commit>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attestation"]
artifacts = ["src/hermes/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "BLE"]

[tool.ruff.lint.per-file-ignores]
# explain.py intentionally catches broad exceptions to honor the module's
# reliability contract ("ranking never waits on this"; explain degrades to
# None rather than propagating). BLE001 (blind except) and S112
# (try-except-continue) are silenced here rather than with inline noqa.
"src/hermes/explain.py" = ["BLE001", "S112"]
# rank.py's profile-vector cache deliberately catches broad exceptions from
# the embedder so a cold Ollama instance falls back to a cached vector
# instead of turning into a feed 500 -- the same reliability contract as
# explain.py above.
"src/hermes/rank.py" = ["BLE001"]
