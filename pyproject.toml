[project]
name = "attestation"
version = "0.1.0"
description = "Auditable research provenance: experiment runs, verifiable claims, a reading graph, and symbolic derivations — fully local"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matthew Goldey" }]
keywords = [
    "research-provenance",
    "reproducibility",
    "knowledge-graph",
    "claim-checking",
    "mcp",
    "local-first",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "feedparser>=6.0",
    "sqlite-vec>=0.1.6",
    "httpx>=0.27",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "langgraph>=0.2",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
    "mcp==1.28.1",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "sympy>=1.13",
]

[project.scripts]
attest = "attestation.cli:main"
attest-mcp = "attestation.mcp_server:main"

[dependency-groups]
# datasette is a dev/ops dependency, never imported by the package: it browses
# hermes.db as a separate process, so a `uvx attestation` install never pays for
# it and a broken version cannot break the tools.
dev = ["pytest>=8", "ruff>=0.6", "ty", "radon>=6", "datasette>=0.64", "datasette-vega>=0.6", "pre-commit>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attestation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_model: needs a running Ollama; excluded from the default run and CI",
]
# Live-model tests are opt-in: `uv run pytest -m live_model`. They assert that
# real embeddings behave the way search assumes -- an acronym reaching its
# expansion, unrelated domains staying apart -- which a hash-based fake cannot
# check. Excluded by default because CI has no model and the pre-commit hook
# should stay a fixed cost.
addopts = "-m 'not live_model'"


[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "BLE", "RUF100"]
