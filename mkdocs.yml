site_name: attestation
site_description: >-
  Auditable research provenance, fully local: experiment runs, verifiable
  claims, a reading knowledge graph, symbolic derivations, and a personalized
  science feed.
repo_url: https://github.com/mgoldey/attestation
docs_dir: docs
strict: true

theme:
  name: material

hooks:
  - docs/_hooks.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false

markdown_extensions:
  - admonition
  - tables
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

# Where each nav page's content actually comes from -- so an edit lands in
# the right place rather than a copy the next build overwrites or ignores:
#   - Generated, never hand-edit: site/specs.md (scripts/render_spec_index.py)
#     and reference/cli.md (scripts/render_cli_reference.py). Both are
#     asserted fresh by tests/test_docs_site.py; a hand edit is silently
#     overwritten by the next `uv run python scripts/render_*.py` and would
#     fail that test in the meantime.
#   - Hand-written stubs: reference/api/*.md, one per module in
#     attestation.__all__, each a `::: attestation.<module>` mkdocstrings
#     directive with no prose of its own -- the prose lives in the module's
#     own docstring.
#   - Snippet-includes: getting-started.md (examples/README.md's
#     golden-path catalogue), via pymdownx.snippets -- the included file
#     stays the single source, this repo included. index.md (README.md) is
#     a special case: `docs/_hooks.py`'s on_page_markdown does that one
#     include itself, in code, rather than leaving it to pymdownx.snippets.
#     Reason: on_page_markdown runs BEFORE pymdownx.snippets expands
#     `--8<--`, so a hook that only rewrote text mkdocs had already inlined
#     would never see anything to rewrite -- the page is still the one-line
#     directive at that point. The hook reads README.md itself and, while
#     inlining it, rewrites `](docs/` -> `](` so a link the README writes
#     for repo-root context (`docs/guides/x.md`) resolves once `docs/` is
#     the serving root, instead of becoming `docs/docs/guides/x.md`.
#   - Symlinks (docs/CONTRIBUTING.md, docs/CHANGELOG.md, docs/examples):
#     point at the repo-root files/directory so a snippet-include's
#     root-relative links resolve under docs_dir, without a second copy to
#     drift. Needs `git config core.symlinks true` (or Windows Developer
#     Mode) at checkout time -- without it, Windows checks these out as
#     plain text files containing the link path, not the linked content.
#
# Nav order follows the front-door shape: start with the answer (Home, which
# snippet-includes README.md), then the glossary a newcomer needs before the
# guides use its words, then install, then the seven guides (one per
# question a collaborator has -- see the guides table in
# docs/superpowers/specs/2026-08-29-docs-for-collaborators-design.md), then
# the runnable catalogue, then reference material, then the four research
# narratives -- grouped as "Notes" because that is what they are, not guides
# -- then the contributor and release docs.
nav:
  - Start here: index.md
  - Concepts: concepts.md
  - Install: guides/install.md
  - Guides:
      - Use it from an agent: guides/agents.md
      - The experiment ledger: guides/ledger.md
      - Claims and citations: guides/claims-and-citations.md
      - The feed and knowledge graph: guides/feed.md
      - Prompt evals and the optimizer: guides/evals.md
      - Tests: guides/testing.md
  - Golden paths: getting-started.md
  - Reference:
      - CLI: reference/cli.md
      - API:
          - ledger: reference/api/ledger.md
          - claims: reference/api/claims.md
          - citations: reference/api/citations.md
          - rank: reference/api/rank.md
          - ingest: reference/api/ingest.md
          - features: reference/api/features.md
          - simulate: reference/api/simulate.md
          - explain: reference/api/explain.md
          - symbolic: reference/api/symbolic.md
          - kg: reference/api/kg.md
          - emit: reference/api/emit.md
          - install: reference/api/install.md
          - llm: reference/api/llm.md
          - embed: reference/api/embed.md
          - db: reference/api/db.md
          - ports: reference/api/ports.md
  - Design records: site/specs.md
  - Measurement lessons: measurement-lessons.md
  - Notes:
      - Architecture: architecture/README.md
      - Research profile: architecture/research-profile.md
      - Recommendation literature review: recommendation-literature-review.md
      - Recommendation refinements: recommendation-refinements.md
      - hermes-agent research: hermes-agent-plugin-research.md
      - Bundled skills research: bundled-skills-research.md
      - Structure and integration points: architecture/structure-and-integration-points.md
  - Contributing: CONTRIBUTING.md
  - Changelog: CHANGELOG.md

# Deliberately-orphaned pages: real content, reachable by browsing the repo
# or the symlinked directory, but not meant to appear in the nav or trigger
# mkdocs's "not included in nav" INFO line. examples/** is the golden-path
# catalogue's own READMEs (linked FROM getting-started.md's included
# catalogue, not duplicated as nav entries); superpowers/** is the specs
# already indexed by site/specs.md and their plans, which specs.md links to
# individually rather than the nav doing so a second time.
not_in_nav: |
  examples/**
  superpowers/**
