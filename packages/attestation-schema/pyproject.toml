[project]
name = "attestation-schema"
# 0.x, not 1.0.0: the record formats are frozen (their identity is the
# `schema` string, pinned by tests/test_frozen.py, not this number), but the
# Python state API (`state.py`) has no consumer yet. 1.0.0 once smeltery runs
# its job backends on it (spec, "v1 freeze": package version). 0.2.0 adds
# datasets, lineage, conformance, the callbacks and `identity` (CHANGELOG);
# `attestation_schema.__version__` reads this, and _FALLBACK_VERSION in
# __init__.py must equal it (tests/test_identity.py).
version = "0.2.0"
description = "The attestation core run record (attestation.run/1, frozen): schema, canonical writer, strict reader, run-directory layout, job state file and job-backend interface. Standard library only."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matthew Goldey" }]
keywords = ["reproducibility", "provenance", "run-record", "experiment-tracking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# Deliberately empty: a producer (smeltery, a training script) depends on this
# package to WRITE a record, and a dependency it must install for that is a
# dependency that gets skipped. See
# docs/superpowers/specs/2026-11-19-core-run-record-design.md.
dependencies = []

# The conformance suite's pytest plugin (`attestation_schema.pytest_plugin`)
# is the ONLY module that needs anything outside the standard library, so
# pytest is an extra, never a dependency: `pip install
# "attestation-schema[conformance]"`. No `pytest11` entry point either -- the
# plugin is opt-in (`-p attestation_schema.pytest_plugin`), so a suite that
# merely has this package installed is unchanged. See
# docs/superpowers/specs/2026-11-19-conformance-suite-design.md.
#
# The training-loop callbacks (`attestation_schema.integrations`) follow the
# same rule: each framework is an extra, imported only by its own module
# (`integrations/huggingface.py`, `integrations/lightning.py`), never by
# `import attestation_schema`. See
# docs/superpowers/specs/2026-11-19-training-callbacks-design.md.
#
# `[mlflow]` is the run-context provider's (`integrations/mlflow.py`, the one
# module importing mlflow). mlflow-skinny, not mlflow: the full package
# depends on it, so either satisfies the extra. Spec:
# docs/superpowers/specs/2026-11-20-mlflow-plugin-design.md.
[project.optional-dependencies]
conformance = ["pytest>=7.2"]
hf = ["transformers>=4.41", "torch>=2.1", "accelerate>=0.26"]
lightning = ["lightning>=2.1"]
mlflow = ["mlflow-skinny>=2.20"]

# MLflow asks every `mlflow.run_context_provider` for tags at each
# `mlflow.start_run`. Declared whatever extras were chosen (entry points have
# no extras), so the provider is active wherever this package and mlflow are
# both installed: on by default, `ATTESTATION_MLFLOW_TAGS=0` turns it off
# (spec, "in_context()").
[project.entry-points."mlflow.run_context_provider"]
attestation = "attestation_schema.integrations.mlflow:AttestationRunContext"

[project.urls]
Repository = "https://github.com/mgoldey/attestation"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attestation_schema"]
