# Spelling and abbreviation variants only -- NEVER conceptual hierarchies.
# Merging genuinely distinct-if-related concepts (deep-learning into
# machine-learning, neural-networks into deep-neural-networks) would destroy
# the structure the graph exists to reveal.
#
# Use counts below are from the live database at authoring time and are
# documentation, not assertions.

[aliases]
"machinelearning" = "machine-learning"          # 141 -> 532
"llm" = "large-language-models"                 # 6
"llms" = "large-language-models"                # 4
"language-models" = "large-language-models"     # 103
"nlp" = "natural-language-processing"           # 68 -> 101
"transformer" = "transformers"                  # 2 -> 109
"deeplearning" = "deep-learning"                # 4 -> 103
"deepneuralnetworks" = "deep-neural-networks"   # 3 -> 104
"generativeai" = "generative-ai"                # 4 -> 36
"huggingface" = "hugging-face"                  # 12 -> 173
"languagemodels" = "large-language-models"      # 2 -> 124
"opensource" = "open-source"                    # 5 -> 257
"transferlearning" = "transfer-learning"        # 5 -> 40
# Fold-key spellings: the canonical form for a family of separator/plural
# variants that [aliases] does not already name.
#
# `canonical()` folds separators and a trailing plural "s" away to get a key,
# then looks the key up HERE. It never computes a spelling of its own. That
# restraint is measured: a computed singular touched 588 tags on the live
# corpus, but 506 of them had no second spelling to merge with -- pure
# renames that mint non-words (`diabetes` -> `diabete`) and rewrite terms of
# art whose plural is the name (`mixture-of-experts`, `scaling-laws`).
#
# So an entry earns its place only when two spellings of ONE concept were
# actually observed. Generated from the live tag distribution and reviewed by
# hand; counts are documentation, not assertions. Spelling only -- never a
# conceptual hierarchy, the same rule as [aliases].
[fold_canonical]
"machinelearning" = "machine-learning"              # machinelearning=463
"finetuning" = "fine-tuning"                        # finetuning=1
"multimodal" = "multimodal"                         # multi-modal=6
"huggingface" = "hugging-face"                      # huggingface=357
"automl" = "auto-ml"                                # automl=1
"reranking" = "re-ranking"                          # reranking=1
"riscv" = "risc-v"                                  # riscv=2, risc-v=1
"multiview" = "multi-view"                          # multiview=1
"multiscale" = "multi-scale"                        # multiscale=2
