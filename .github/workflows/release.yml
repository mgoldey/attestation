name: Release

# Tag-triggered PyPI publish through trusted publishing (OIDC): no API token
# lives in this repo. Two distributions are built from this repo and they
# version independently, so there are two tag forms in this one workflow
# (PyPI's trusted publisher is registered against release.yml + environment
# pypi for BOTH projects):
#
#   v<X.Y.Z>          releases attestation        (pyproject.toml)
#   schema-v<X.Y.Z>   releases attestation-schema (packages/attestation-schema)
#
#   git tag v0.5.0 && git push origin v0.5.0
#   git tag schema-v0.2.0 && git push origin schema-v0.2.0
#
# The two filters cannot both match one tag: GitHub's `*` does not cross `/`
# and a filter is anchored at both ends, so `v*` needs a leading "v" and
# `schema-v*` a leading "schema-". Each job also carries an `if:` on the tag
# prefix so the separation does not rest on the filter alone, and
# tests/test_release_workflow.py pins both.
#
# Each build job refuses a tag that does not match its package's version, so a
# release cannot ship under a number the package does not carry. Release the
# schema FIRST when attestation's `attestation-schema>=X` floor is new: the
# attestation build job fails fast while X is not on PyPI.

on:
  push:
    tags: ["v*", "schema-v*"]

jobs:
  build:
    name: build + smoke (attestation)
    if: ${{ startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "$tag" = "$version" || { echo "tag v$tag != pyproject version $version" >&2; exit 1; }

      - name: attestation-schema floor is published on PyPI
        # attestation's wheel says Requires-Dist: attestation-schema>=X; if X
        # is not on the index the release installs for nobody. Fail now, with
        # the fix in the message, rather than after publishing.
        run: |
          python3 - <<'PY'
          import json, re, sys, time, tomllib, urllib.error, urllib.request

          deps = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]
          floors = [m.group(1) for d in deps
                    if (m := re.match(r"attestation-schema\s*>=\s*([0-9][^\s,;]*)", d))]
          if len(floors) != 1:
              sys.exit(f"expected one 'attestation-schema>=X' dependency, found {floors}")
          floor = floors[0]
          url = "https://pypi.org/pypi/attestation-schema/json"
          data = None
          for attempt in range(4):
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      data = json.load(r)
                  break
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      sys.exit("attestation-schema is not on PyPI at all: release it first "
                               "(git tag schema-v" + floor + " && git push origin schema-v" + floor + ")")
                  err = e
              except Exception as e:  # noqa: BLE001 - any failure here means cannot verify
                  err = e
              time.sleep(3 * (attempt + 1))
          if data is None:
              sys.exit(f"cannot verify that attestation-schema {floor} is on PyPI ({err}); "
                       "refusing to release without the check")
          files = data["releases"].get(floor) or []
          if not any(not f.get("yanked") for f in files):
              sys.exit(f"attestation-schema>={floor} is not published on PyPI "
                       f"(published: {sorted(data['releases'])}): release it first "
                       f"(git tag schema-v{floor} && git push origin schema-v{floor})")
          print(f"attestation-schema {floor} is on PyPI")
          PY

      - name: Build sdist + wheel
        run: uv build

      - name: Wheel installs and both console scripts answer
        run: |
          python3 -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --quiet dist/*.whl
          /tmp/wheel-venv/bin/attest --help >/dev/null
          /tmp/wheel-venv/bin/attestation --help >/dev/null
          /tmp/wheel-venv/bin/attest-mcp --help >/dev/null 2>&1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI (attestation)
    needs: build
    if: ${{ startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  build-schema:
    name: build + smoke (attestation-schema)
    if: ${{ startsWith(github.ref_name, 'schema-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#schema-v}"
          version="$(python3 -c "import tomllib; print(tomllib.load(open('packages/attestation-schema/pyproject.toml','rb'))['project']['version'])")"
          test "$tag" = "$version" || { echo "tag schema-v$tag != attestation-schema version $version" >&2; exit 1; }

      - name: Build sdist + wheel
        run: uv build --package attestation-schema --out-dir dist-schema

      - name: Package tests on CPython 3.11 against the built wheel
        # As the schema-py311 CI job: a bare 3.11 venv holding only the wheel
        # (the JCS parity test skips: it needs attestation).
        run: |
          uv venv --python 3.11 /tmp/schema-311
          uv pip install --python /tmp/schema-311/bin/python dist-schema/*.whl pytest jsonschema
          cd packages/attestation-schema
          /tmp/schema-311/bin/python -c "import sys; assert sys.version_info[:2] == (3, 11), sys.version"
          /tmp/schema-311/bin/python -m pytest -q -p no:cacheprovider -c /dev/null --rootdir . tests

      - uses: actions/upload-artifact@v4
        with:
          name: dist-schema
          path: dist-schema/

  publish-schema:
    name: publish to PyPI (attestation-schema)
    needs: build-schema
    if: ${{ startsWith(github.ref_name, 'schema-v') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-schema
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
