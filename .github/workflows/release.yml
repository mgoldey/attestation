name: Release

# Tag-triggered PyPI publish through trusted publishing (OIDC): no API token
# lives in this repo. Two distributions are built from this repo and they
# version independently, so there are two tag forms in this one workflow
# (PyPI's trusted publisher is registered against release.yml + environment
# pypi for BOTH projects):
#
#   v<X.Y.Z>          releases attestation        (pyproject.toml)
#   schema-v<X.Y.Z>   releases attestation-schema (packages/attestation-schema)
#
#   git tag v0.5.0 && git push origin v0.5.0
#   git tag schema-v0.2.0 && git push origin schema-v0.2.0
#
# The two filters cannot both match one tag: GitHub's `*` does not cross `/`
# and a filter is anchored at both ends, so `v*` needs a leading "v" and
# `schema-v*` a leading "schema-". Each job also carries an `if:` on the tag
# prefix so the separation does not rest on the filter alone, and
# tests/test_release_workflow.py pins both.
#
# Each build job refuses a tag that does not match its package's version (the
# static [project].version AND every built file's name), so a release cannot
# ship under a number the package does not carry. Release the schema FIRST when
# attestation's `attestation-schema>=X` floor is new: the attestation build job
# fails fast (scripts/check_schema_floor.py) while X is not on PyPI.
#
# The build + guard + smoke half is the shared reusable-wheel-smoke.yml (roadmap
# 39: smeltery's release calls it too); the PUBLISH jobs stay here, in
# this top-level workflow, because PyPI trusted publishing does not work from a
# reusable workflow (docs.pypi.org/trusted-publishers/troubleshooting/,
# "Reusable workflows on GitHub"), and the publisher registered on PyPI names
# this file. Spec: docs/superpowers/specs/2026-11-20-shared-ci-templates-design.md.

on:
  push:
    tags: ["v*", "schema-v*"]

permissions:
  contents: read

jobs:
  build:
    name: build + smoke (attestation)
    if: ${{ startsWith(github.ref_name, 'v') }}
    uses: ./.github/workflows/reusable-wheel-smoke.yml
    with:
      build-python-version: "3.12"
      tag-prefix: v
      version-file: pyproject.toml
      pre-build: python3 scripts/check_schema_floor.py
      build-command: uv build --out-dir dist
      dist-dir: dist
      artifact-name: dist
      smoke-python-versions: '["3.12"]'
      smoke-command: |
        python3 -m venv /tmp/wheel-venv
        /tmp/wheel-venv/bin/pip install --quiet dist/*.whl
        /tmp/wheel-venv/bin/attest --help >/dev/null
        /tmp/wheel-venv/bin/attestation --help >/dev/null
        /tmp/wheel-venv/bin/attest-mcp --help >/dev/null 2>&1 || true

  publish:
    name: publish to PyPI (attestation)
    needs: build
    if: ${{ startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  build-schema:
    name: build + smoke (attestation-schema)
    if: ${{ startsWith(github.ref_name, 'schema-v') }}
    uses: ./.github/workflows/reusable-wheel-smoke.yml
    with:
      build-python-version: "3.11"
      tag-prefix: schema-v
      version-file: packages/attestation-schema/pyproject.toml
      build-command: uv build --package attestation-schema --out-dir dist-schema
      dist-dir: dist-schema
      artifact-name: dist-schema
      smoke-python-versions: '["3.11"]'
      # As the schema-py311 CI job: a bare 3.11 venv holding only the wheel
      # (the JCS parity test skips: it needs attestation).
      smoke-command: |
        uv venv --python 3.11 /tmp/schema-311
        uv pip install --python /tmp/schema-311/bin/python dist-schema/*.whl pytest jsonschema
        cd packages/attestation-schema
        /tmp/schema-311/bin/python -c "import sys; assert sys.version_info[:2] == (3, 11), sys.version"
        /tmp/schema-311/bin/python -m pytest -q -p no:cacheprovider -c /dev/null --rootdir . tests

  publish-schema:
    name: publish to PyPI (attestation-schema)
    needs: build-schema
    if: ${{ startsWith(github.ref_name, 'schema-v') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-schema
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
