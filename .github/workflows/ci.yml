name: CI

# The gates, the pre-commit hooks and the wheel smoke test run through the
# shared reusable workflows in this directory (reusable-*.yml, roadmap 39:
# smeltery and ferric call the same files by a pinned commit SHA). A job that
# calls one shows its check as "<this job's name> / <the called job's name>".
# Spec: docs/superpowers/specs/2026-11-20-shared-ci-templates-design.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: gates (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    uses: ./.github/workflows/reusable-python-gates.yml
    with:
      runs-on: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      # macos-latest ships a python.org framework build at
      # /Library/Frameworks/Python.framework, and uv picks it over its own
      # managed CPython when the version matches. That build has no
      # sqlite3 loadable-extension support, so sqlite-vec cannot load and
      # db.get_db() dies at conn.enable_load_extension (254 failures on the
      # first CI run, 2026-08-28). uv's managed builds enable it on every OS.
      python-preference: only-managed
      sync-args: --all-extras --dev
      # ruff-version empty: the locked ruff (`uv run --no-sync ruff`), the one
      # the pre-commit hooks run.
      ty-command: uv run --no-sync ty check src/ packages/attestation-schema/src/
      lock-check: true
      checks: |
        echo "complexity ratchet (radon)"
        uv run --no-sync python scripts/check_complexity.py
        echo "bandit (security)"
        uv run --no-sync bandit -q -c pyproject.toml -r src/attestation --severity-level medium
        echo "xenon (maintainability)"
        uv run --no-sync xenon --max-modules B --max-average A src/attestation
      test-command: uv run --no-sync pytest -q

  pre-commit:
    # The local hooks (.pre-commit-config.yaml) run as-is, so what a
    # contributor's hooks check and what CI checks cannot drift (gates runs
    # the same tools as separate steps across the matrix). pytest is skipped:
    # gates runs the suite in all four cells.
    name: pre-commit
    uses: ./.github/workflows/reusable-pre-commit.yml
    with:
      python-version: "3.12"
      python-preference: only-managed
      sync-args: --all-extras --dev
      skip: pytest

  wheel-smoke:
    # Both distributions this repo builds, installed with plain pip into fresh
    # venvs: scripts/wheel_smoke.sh. attestation-schema is not on an index at
    # the version attestation needs, so the attestation wheel installs with
    # the schema wheel beside it -- see docs/superpowers/specs/
    # 2026-11-19-ledger-reads-core-records-design.md, "Dependency".
    name: wheel smoke test
    uses: ./.github/workflows/reusable-wheel-smoke.yml
    with:
      build-python-version: "3.12"
      build-command: |
        uv build --out-dir dist
        uv build --package attestation-schema --out-dir dist
      dist-dir: dist
      artifact-name: wheels
      smoke-python-versions: '["3.12"]'
      smoke-command: bash scripts/wheel_smoke.sh dist

  schema-py311:
    # attestation-schema supports Python >= 3.11 (smeltery, a producer, is
    # 3.11-only); attestation itself stays >= 3.12, so the workspace venv
    # cannot run on 3.11. The package's own tests run here against its
    # installed wheel in a bare 3.11 venv (the JCS parity test skips: it
    # needs attestation).
    name: attestation-schema on py3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"

      - name: Build the attestation-schema wheel
        run: uv build --package attestation-schema --wheel --out-dir dist-schema

      - name: Package tests on CPython 3.11
        run: |
          uv venv --python 3.11 /tmp/schema-311
          # With the [conformance] extra: the package tests include the
          # pytest plugin's pytester tests, and pytest comes from the extra.
          uv pip install --python /tmp/schema-311/bin/python "$(ls dist-schema/*.whl)[conformance]" jsonschema
          cd packages/attestation-schema
          /tmp/schema-311/bin/python -c "import sys; assert sys.version_info[:2] == (3, 11), sys.version"
          /tmp/schema-311/bin/python -m pytest -q -p no:cacheprovider -c /dev/null --rootdir . tests

      - name: Conformance suite on the committed MLflow records (installed wheel, 3.11)
        # Exactly what a producer runs in its own CI (README "Conformance"):
        # the opt-in plugin from the installed wheel, one test per record. A
        # glob matching nothing fails rather than passing vacuously. Spec:
        # docs/superpowers/specs/2026-11-19-conformance-suite-design.md.
        run: |
          /tmp/schema-311/bin/python -m pytest -q -p no:cacheprovider -c /dev/null --rootdir . \
            -p attestation_schema.pytest_plugin \
            --attestation-runs 'examples/mlflow-records/records/*' examples/mlflow-records/records

  flows:
    name: example flows (offline)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Sync dependencies (with the examples group)
        run: uv sync --all-extras --dev --group examples

      - name: Every flow, against the stub model server
        # The demonstration in examples/flows, end to end: the MLflow family,
        # the persona eval, and every MCP tool over stdio. No Ollama, no
        # network. Its numbers are about the stub and say so; the point is
        # that the flows cannot rot.
        run: uv run python examples/flows/run_all.py --offline

  docs:
    name: docs site
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Sync dependencies (with the docs group)
        run: uv sync --all-extras --dev --group docs

      - name: mkdocs build --strict
        # A docstring that breaks a cross-reference, or a nav entry in
        # mkdocs.yml that points nowhere, fails the push here rather than
        # rotting silently. The `gates` job does not install the docs group,
        # so this job runs the real build itself.
        run: uv run --group docs mkdocs build --strict

      - name: Upload built site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site/

  schema-integrations:
    # The training-loop callbacks (attestation_schema.integrations) on real,
    # tiny CPU training runs, against the installed wheel with its [hf] and
    # [lightning] extras, on the package's 3.11 floor -- and the [mlflow]
    # run-context provider on a real local MLflow file store, discovered
    # through the wheel's entry point (2026-11-20-mlflow-plugin-design.md).
    # A job of its own, not part of the bare 3.11 job, whose evidence is that the package works with
    # NOTHING installed (the framework tests skip there, which is itself the check
    # that the core never imports a framework). Not in gates either: torch
    # from PyPI pulls ~2.5 GB of CUDA wheels into each of four matrix cells.
    # Spec: docs/superpowers/specs/2026-11-19-training-callbacks-design.md.
    name: attestation-schema training callbacks (py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"

      - name: Build the attestation-schema wheel
        run: uv build --package attestation-schema --wheel --out-dir dist-schema

      - name: Install the wheel with its extras (CPU torch)
        run: |
          uv venv --python 3.11 /tmp/schema-int
          # torch first, from PyTorch's CPU index (no CUDA wheels); the
          # extras then find it satisfied.
          uv pip install --python /tmp/schema-int/bin/python torch \
            --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python /tmp/schema-int/bin/python \
            "$(ls dist-schema/*.whl)[hf,lightning,mlflow,conformance]"

      - name: Callback tests on real training runs (a skip is a failure here)
        env:
          ATTESTATION_REQUIRE_INTEGRATIONS: "1"
        run: |
          cd packages/attestation-schema
          /tmp/schema-int/bin/python -c "import sys; assert sys.version_info[:2] == (3, 11), sys.version"
          /tmp/schema-int/bin/python -m pytest -q -rs -p no:cacheprovider -c /dev/null --rootdir . \
            tests/test_integrations_core.py tests/test_integrations_hf.py \
            tests/test_integrations_lightning.py tests/test_mlflow_mapping.py \
            tests/test_integrations_mlflow.py
